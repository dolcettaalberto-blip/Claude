<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alberto's Health Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #edf3fb; color: #0f172a; }
    #root { min-height: 100vh; }
    #loader { display: flex; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #64748b; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="root"><div id="loader">LOADING…</div></div>

  <!-- React + ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- prop-types (required by Recharts) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Recharts (UMD) — stable version -->
  <script src="https://unpkg.com/recharts@2.9.0/umd/Recharts.js"></script>

  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    // Shim: make Recharts available as a module-like import
    const {
      ComposedChart, LineChart, BarChart, Line, Bar,
      XAxis, YAxis, CartesianGrid, Tooltip,
      ResponsiveContainer, ReferenceLine, Cell
    } = Recharts;

    const { useState, useEffect, useCallback, useMemo } = React;

    // ─── CONFIG ────────────────────────────────────────────────────────────

    const INJURY_DATE = '2026-03-24';
    const HRV_BASELINE = 60;
    const SHEET_ID = '1W4gds8ZClrWikkKKF27yY6riQnUFPtWKaGEeKbZe4to';
    const SP = 'itbs:';

    const C = {
      bg: '#edf3fb', surface: '#ffffff', surface2: '#edf3fb', surface3: '#ddeaf7',
      border: '#ccddf2', border2: '#aac5e6',
      right: '#ea580c', left: '#2563eb',
      hrv: '#059669', warn: '#d97706', crit: '#dc2626', muted: '#94a3b8',
      text: '#0f172a', textDim: '#475569',
    };

    const MONO = "'IBM Plex Mono', 'Courier New', monospace";
    const SANS = "'Montserrat', system-ui, sans-serif";

    const RUN_WEEKS = [
      { week: 1, run: 1, walk: 2, reps: 10, freq: 3 },
      { week: 2, run: 2, walk: 2, reps: 8, freq: 3 },
      { week: 3, run: 3, walk: 1, reps: 6, freq: 3 },
      { week: 4, run: null, walk: null, reps: null, freq: 3, desc: 'Continuous running, progressive duration' },
    ];

    // ─── STORAGE ───────────────────────────────────────────────────────────

    const store = {
      get(k) {
        try {
          const s = (window.storage && typeof window.storage.getItem === 'function') ? window.storage : localStorage;
          const v = s.getItem(SP + k);
          return v ? JSON.parse(v) : null;
        } catch { return null; }
      },
      set(k, v) {
        try {
          const s = (window.storage && typeof window.storage.setItem === 'function') ? window.storage : localStorage;
          s.setItem(SP + k, JSON.stringify(v));
          return true;
        } catch { return false; }
      },
    };

    // ─── DATE UTILS ────────────────────────────────────────────────────────

    const today = () => new Date().toISOString().slice(0, 10);
    const daysSince = (d) => Math.floor((Date.now() - new Date(d + 'T12:00:00').getTime()) / 86400000);
    const addDays = (d, n) => {
      const dt = new Date(d + 'T12:00:00');
      dt.setDate(dt.getDate() + n);
      return dt.toISOString().slice(0, 10);
    };
    const fmtShort = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '—';

    // ─── GARMIN SYNC (HRV + Sleep) ─────────────────────────────────────────

    const GARMIN_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQRo0q5gSheb-e2_Jo-s7y6uIf8mcZcEzyjET61oGfDJ_2bybXh0o8FDErqNrysEMCM3fYu2KfGHyzD/pub?gid=1605637632&single=true&output=csv';

    async function syncGarmin(appsScriptUrl) {
      // Try Apps Script first — returns hrv, sleep + activities in one call
      if (appsScriptUrl) {
        try {
          const resp = await fetch(appsScriptUrl + '?_action=getGarmin&_=' + Date.now(), { redirect: 'follow' });
          if (resp.ok) {
            const json = await resp.json();
            if (Array.isArray(json.hrvData) && Array.isArray(json.sleepData) && json.hrvData.length + json.sleepData.length > 0) {
              return { hrvData: json.hrvData, sleepData: json.sleepData, activitiesData: json.activitiesData || [] };
            }
          }
        } catch (e) { /* fall through to CSV */ }
      }
      // Fallback: public CSV (no activities data available)
      const resp = await fetch(GARMIN_URL + '&_=' + Date.now(), { credentials: 'omit', cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const csv = await resp.text();
      const lines = csv.trim().split('\n');
      if (lines.length < 2) throw new Error('Empty sheet');
      const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
      const idIdx    = headers.indexOf('id');
      const hrvIdx   = headers.indexOf('hrv');
      const secsIdx  = headers.indexOf('sleepsecs');
      const scoreIdx = headers.indexOf('sleepscore');
      if (idIdx < 0) throw new Error('id column missing');
      const hrvData = [], sleepData = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        const date = (cols[idIdx] || '').replace(/"/g, '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
        const hrv   = parseFloat((cols[hrvIdx]   || '').replace(/"/g, '').trim());
        const secs  = parseFloat((cols[secsIdx]  || '').replace(/"/g, '').trim());
        const score = parseFloat((cols[scoreIdx] || '').replace(/"/g, '').trim());
        if (hrvIdx >= 0 && hrv > 0 && !isNaN(hrv)) hrvData.push({ date, hrv: Math.round(hrv) });
        if (secs > 0 && !isNaN(secs)) {
          const entry = { date, sleepHours: Math.round(secs / 360) / 10 };
          if (score > 0 && !isNaN(score)) entry.sleepScore = Math.round(score);
          sleepData.push(entry);
        }
      }
      return { hrvData, sleepData, activitiesData: [] };
    }

    // ─── CLOUD SYNC ────────────────────────────────────────────────────────

    function mergeCheckins(a, b) {
      const m = {};
      for (const ci of [...(a || []), ...(b || [])]) {
        const key = ci.id || ci.date;
        if (!m[key] || (ci._savedAt || 0) >= (m[key]._savedAt || 0)) m[key] = ci;
      }
      return Object.values(m).sort((x, y) => {
        const dc = x.date.localeCompare(y.date);
        return dc !== 0 ? dc : (x.time || '').localeCompare(y.time || '');
      });
    }
    function mergeRunProt(local, cloud) {
      const lS = local?.sessions || [], cS = cloud?.sessions || [];
      const map = {};
      for (const s of [...lS, ...cS]) {
        const key = `${s.date}_${s.week}_${s.sessionNum}`;
        if (!map[key]) map[key] = s;
      }
      return { currentWeek: Math.max(local?.currentWeek || 1, cloud?.currentWeek || 1), sessions: Object.values(map).sort((a, b) => a.date.localeCompare(b.date)) };
    }
    function mergeAlcohol(a, b) {
      const m = {};
      for (const e of [...(a || []), ...(b || [])]) {
        if (!m[e.id] || (e._savedAt || 0) >= (m[e.id]._savedAt || 0)) m[e.id] = e;
      }
      return Object.values(m).sort((x, y) => x.date !== y.date ? x.date.localeCompare(y.date) : (x.time || '').localeCompare(y.time || ''));
    }
    function mergeAppData(local, cloud) {
      if (!cloud || typeof cloud !== 'object') return local;
      return {
        checkins:    mergeCheckins(local.checkins, cloud.checkins),
        runProtocol: mergeRunProt(local.runProtocol, cloud.runProtocol),
        alcoholLog:  mergeAlcohol(local.alcoholLog, cloud.alcoholLog),
      };
    }
    async function cloudPull(url) {
      const sep = url.includes('?') ? '&' : '?';
      const r = await fetch(url + sep + '_t=' + Date.now(), { redirect: 'follow' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return JSON.parse(await r.text());
    }
    async function appendCheckinToSheet(url, entry, sleepEntry) {
      if (!url) return;
      try {
        await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            _action: 'appendCheckin',
            date: entry.date, time: entry.time || '',
            hrv: entry.hrv ?? '', workStress: entry.workStress ?? '',
            feeling: entry.feeling ?? '', coffee: entry.coffee ?? 0,
            painR: entry.painR ?? '', painL: entry.painL ?? '',
            sleepHours: sleepEntry?.sleepHours ?? '', sleepScore: sleepEntry?.sleepScore ?? '',
            activityTypes: entry.activityTypes || [], notes: entry.notes || '',
          }),
          redirect: 'follow',
        });
      } catch (e) { console.warn('appendCheckinToSheet:', e.message); }
    }

    async function cloudPush(url, payload) {
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ ...payload, _pushedAt: new Date().toISOString() }),
        redirect: 'follow',
      });
    }

    // ─── COMPUTATIONS ──────────────────────────────────────────────────────

    // helpers for multi-checkin-per-day
    const dayCIs = (checkins, date) =>
      checkins.filter(c => c.date === date).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const latestHRV = (checkins, date, hrvSheet) => {
      const withHRV = [...dayCIs(checkins, date)].reverse().find(c => c.hrv);
      return withHRV?.hrv ?? hrvSheet.find(h => h.date === date)?.hrv ?? null;
    };
    const dayMaxPain = (checkins, date) => {
      const cis = dayCIs(checkins, date).filter(c => c.painR != null);
      return cis.length ? { painR: Math.max(...cis.map(c => c.painR)), painL: Math.max(...cis.map(c => c.painL ?? 0)) } : null;
    };
    const normaliseCI = (ci, idx) => ({
      ...ci,
      id: ci.id || `ci_${ci.date}_${idx}`,
      activityTypes: ci.activityTypes || (ci.activityType ? [ci.activityType] : []),
      coffee: ci.coffee ?? 0,
      feeling: ci.feeling ?? null,
    });

    function recoveryStatus(checkins, hrvSheet) {
      const cutoff = addDays(today(), -7);
      const rec = checkins.filter(c => c.date >= cutoff);
      const hrvsAll = [];
      Array.from({ length: 7 }, (_, i) => addDays(today(), -6 + i)).forEach(d => {
        const v = latestHRV(rec, d, hrvSheet);
        if (v) hrvsAll.push(v);
      });
      const avgHRV = hrvsAll.length ? hrvsAll.reduce((a, b) => a + b, 0) / hrvsAll.length : null;
      const uniqueDates = [...new Set(rec.map(c => c.date))];
      const pains = uniqueDates.map(d => dayMaxPain(rec, d)).filter(Boolean);
      const avgPain = pains.length ? pains.reduce((a, c) => a + Math.max(c.painR, c.painL), 0) / pains.length : null;
      if (!avgHRV && avgPain == null) return { label: 'NO DATA', color: C.muted, emoji: '⚪' };
      const ratio = avgHRV ? avgHRV / HRV_BASELINE : null;
      if ((ratio && ratio < 0.8) || (avgPain != null && avgPain > 3)) return { label: 'IN THE HOLE', color: C.crit, emoji: '🔴' };
      if (ratio && ratio >= 0.95 && (avgPain == null || avgPain <= 1)) return { label: 'TRENDING UP', color: C.hrv, emoji: '🟢' };
      return { label: 'STABILIZING', color: C.warn, emoji: '🟡' };
    }

    function autoFlags(ci) {
      if (!ci) return [];
      const flags = [];
      const highPain = (ci.painR ?? 0) > 2 || (ci.painL ?? 0) > 2;
      const highAllo = (ci.workStress ?? 0) >= 4 && (ci.hrv ?? 99) < 50;
      if (highPain && highAllo) return [{ level: 'crit', msg: 'Recovery deficit: rest or cross-train only' }];
      if (highPain) flags.push({ level: 'warn', msg: 'Exceeds load threshold — pain >2/10' });
      if (highAllo) flags.push({ level: 'crit', msg: 'High allostatic load — consider reducing training today' });
      return flags;
    }

    function computeInsights(checkins) {
      const out = [];
      const sorted = [...checkins].sort((a, b) => {
        const dc = b.date.localeCompare(a.date);
        return dc !== 0 ? dc : (b.time || '').localeCompare(a.time || '');
      });
      let rStreak = 0;
      for (const c of sorted) { if ((c.painR ?? 99) <= 2) rStreak++; else break; }
      if (rStreak >= 4) out.push(`Right knee pain ≤2 for ${rStreak} days — earliest Week 1 run: ${fmtShort(addDays(today(), 1))}`);
      else if (rStreak > 0) out.push(`Right knee: ${rStreak} day${rStreak > 1 ? 's' : ''} ≤2/10 — need ${4 - rStreak} more for run eligibility`);
      else out.push('Right knee pain >2 — run protocol on hold');
      const r3 = sorted.slice(0, 3);
      if (r3.length === 3 && r3.every(c => (c.hrv ?? 99) < 50 && (c.workStress ?? 0) >= 4))
        out.push(`HRV suppressed + work stress ≥4 for 3 days — stress-compounded recovery`);
      else {
        const latest = sorted[0];
        if (latest?.hrv) {
          const delta = latest.hrv - HRV_BASELINE;
          out.push(`Latest HRV ${latest.hrv}ms (${delta > 0 ? '+' : ''}${delta} vs ${HRV_BASELINE}ms baseline)`);
        } else out.push(`Log daily HRV to unlock trend insights`);
      }
      return out.slice(0, 3);
    }

    // ─── SHARED UI ─────────────────────────────────────────────────────────

    function Tip({ active, payload, label }) {
      if (!active || !payload?.length) return null;
      return (
        <div style={{ background: C.surface, border: `1px solid ${C.border2}`, padding: '8px 12px', fontSize: 12, fontFamily: MONO, boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }}>
          <div style={{ color: C.textDim, marginBottom: 4 }}>{label}</div>
          {payload.map((p, i) => p.value != null && (
            <div key={i} style={{ color: p.color || C.text }}>{p.name}: {p.value}</div>
          ))}
        </div>
      );
    }

    function MetricCard({ label, value, unit, sub, color, animate }) {
      const [disp, setDisp] = useState(animate && typeof value === 'number' ? 0 : value);
      useEffect(() => {
        if (!animate || typeof value !== 'number') { setDisp(value); return; }
        if (value === 0) { setDisp(0); return; }
        let cur = 0;
        const step = Math.max(1, Math.ceil(value / 30));
        const t = setInterval(() => {
          cur += step;
          if (cur >= value) { setDisp(value); clearInterval(t); }
          else setDisp(cur);
        }, 20);
        return () => clearInterval(t);
      }, [value]);
      return (
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: '12px 16px', minWidth: 110 }}>
          <div style={{ fontSize: 10, color: C.textDim, textTransform: 'uppercase', letterSpacing: 1, fontFamily: SANS, marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 26, fontFamily: MONO, color: color || C.text, lineHeight: 1 }}>
            {disp ?? '—'}
            {unit && <span style={{ fontSize: 12, color: C.textDim, marginLeft: 3 }}>{unit}</span>}
          </div>
          {sub && <div style={{ fontSize: 10, color: C.textDim, marginTop: 3, fontFamily: SANS }}>{sub}</div>}
        </div>
      );
    }

    function FlagBanner({ flags }) {
      return flags.map((f, i) => (
        <div key={i} style={{
          background: f.level === 'crit' ? '#ef444420' : '#f59e0b18',
          border: `1px solid ${f.level === 'crit' ? C.crit : C.warn}`,
          padding: '9px 14px', fontSize: 12, fontFamily: MONO,
          color: f.level === 'crit' ? C.crit : C.warn,
          display: 'flex', alignItems: 'center', gap: 8
        }}>
          <span>{f.level === 'crit' ? '⚠' : '△'}</span> {f.msg}
        </div>
      ));
    }

    function Btn({ children, onClick, active, color, small, disabled }) {
      return (
        <button onClick={onClick} disabled={disabled} style={{
          background: active ? (color || C.border2) : 'transparent',
          border: `1px solid ${active ? (color || C.border2) : C.border}`,
          color: active ? C.text : C.textDim,
          padding: small ? '4px 10px' : '8px 16px',
          fontSize: small ? 11 : 13, fontFamily: MONO,
          cursor: disabled ? 'default' : 'pointer',
          borderRadius: 2, opacity: disabled ? 0.4 : 1,
        }}>
          {children}
        </button>
      );
    }

    // ─── DASHBOARD ─────────────────────────────────────────────────────────

    function Dashboard({ checkins, hrvSheet, sleepSheet, alcoholLog, activitiesSheet = [] }) {
      const td = today();
      const todayCIs = dayCIs(checkins, td);
      const todayCI = todayCIs[todayCIs.length - 1] || null; // latest today
      const daysInj = daysSince(INJURY_DATE);
      const todayHRV = latestHRV(checkins, td, hrvSheet);
      const hrvDelta = todayHRV != null ? todayHRV - HRV_BASELINE : null;
      const recov = useMemo(() => recoveryStatus(checkins, hrvSheet), [checkins, hrvSheet]);
      const ins = useMemo(() => computeInsights(checkins), [checkins]);
      const flags = useMemo(() => autoFlags(todayCI), [todayCI]);

      const chartData = useMemo(() => {
        const dates = Array.from({ length: 30 }, (_, i) => addDays(td, -29 + i));
        return dates.map((date, idx) => {
          const hrv = latestHRV(checkins, date, hrvSheet);
          const window7 = dates.slice(Math.max(0, idx - 6), idx + 1);
          const vals = window7.map(d => latestHRV(checkins, d, hrvSheet)).filter(Boolean);
          const hrv7 = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
          const latestToday = dayCIs(checkins, date).slice(-1)[0];
          const sleepEntry = sleepSheet.find(s => s.date === date);
          const sleep = sleepEntry?.sleepHours ?? null;
          const hasAlcohol = (alcoholLog || []).some(e => e.date === date);
          return { label: fmtShort(date), hrv, hrv7, stress: latestToday?.workStress ?? null, sleep, hasAlcohol };
        });
      }, [checkins, hrvSheet, sleepSheet, alcoholLog, td]);

      const painData = useMemo(() => {
        return Array.from({ length: 14 }, (_, i) => {
          const date = addDays(td, -13 + i);
          const mp = dayMaxPain(checkins, date);
          return { label: fmtShort(date), painR: mp?.painR ?? 0, painL: mp?.painL ?? 0 };
        });
      }, [checkins, td]);

      const RUN_TYPES = ['Run','VirtualRun','TrailRun'];
      const weekLoad = useMemo(() => {
        const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return Array.from({ length: 7 }, (_, i) => {
          const date = addDays(td, -6 + i);
          const d = new Date(date + 'T12:00:00');
          // From Garmin/intervals.icu activities sheet
          const dayActs = activitiesSheet.filter(a => a.date === date);
          const hasRun = dayActs.some(a => RUN_TYPES.includes(a.type));
          const hasWorkout = dayActs.some(a => !RUN_TYPES.includes(a.type));
          // Manual entries from check-in (Physio, Rest)
          const cis = dayCIs(checkins, date);
          const manualActs = cis.flatMap(ci => ci.activityTypes || []);
          const hasPhysio = manualActs.includes('Physio session');
          return {
            label: dayNames[d.getDay()],
            Run: hasRun ? 1 : 0,
            Workout: hasWorkout ? 1 : 0,
            Physio: hasPhysio ? 1 : 0,
          };
        });
      }, [checkins, activitiesSheet, td]);

      const hrvColor = todayHRV == null ? C.muted
        : todayHRV >= HRV_BASELINE * 0.95 ? C.hrv
        : todayHRV >= HRV_BASELINE * 0.8 ? C.warn : C.crit;

      return (
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 16 }}>
          <FlagBanner flags={flags} />
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <MetricCard label="Days Since Injury" value={daysInj} sub={`Onset ${INJURY_DATE}`} color={C.textDim} animate />
            <MetricCard label="HRV Today" value={todayHRV} unit="ms"
              sub={hrvDelta != null ? `${hrvDelta > 0 ? '+' : ''}${hrvDelta}ms vs baseline` : `Baseline: ${HRV_BASELINE}ms`}
              color={hrvColor} animate />
            <MetricCard label="Pain (L)" value={todayCI?.painL} unit="/10" sub="Left knee — secondary"
              color={todayCI?.painL > 5 ? C.crit : todayCI?.painL > 2 ? C.warn : C.left} animate />
            <MetricCard label="Pain (R)" value={todayCI?.painR} unit="/10" sub="Right knee — primary"
              color={todayCI?.painR > 5 ? C.crit : todayCI?.painR > 2 ? C.warn : C.right} animate />
            <MetricCard label="Work Stress" value={todayCI?.workStress} unit="/5"
              color={todayCI?.workStress >= 4 ? C.crit : todayCI?.workStress >= 3 ? C.warn : C.hrv} animate />
            {(() => {
              const se = sleepSheet.find(s => s.date === td);
              const sh = se?.sleepHours ?? null;
              const sc = se?.sleepScore ?? null;
              return (
                <MetricCard label="Sleep" value={sh} unit="h"
                  sub={sc != null ? `Score ${sc}/100` : 'from Garmin'}
                  color={sh >= 7 ? C.hrv : sh >= 6 ? C.warn : sh != null ? C.crit : C.muted} animate />
              );
            })()}
            {(() => {
              const cis = dayCIs(checkins, td);
              const totalCoffee = cis.reduce((s, c) => s + (c.coffee || 0), 0);
              const latestFeeling = [...cis].reverse().find(c => c.feeling != null)?.feeling ?? null;
              return (<>
                <MetricCard label="Feeling" value={latestFeeling} unit="/10"
                  sub={latestFeeling >= 8 ? '🌟 Great' : latestFeeling >= 6 ? '🙂 Good' : latestFeeling >= 4 ? '😐 OK' : latestFeeling != null ? '😕 Low' : 'today'}
                  color={latestFeeling >= 7 ? C.hrv : latestFeeling >= 5 ? C.warn : latestFeeling != null ? C.crit : C.muted} animate />
                <MetricCard label="Coffee" value={totalCoffee || null} unit="☕"
                  sub="today" color={totalCoffee > 3 ? C.warn : C.textDim} animate />
                {(() => {
                  const todayAl = (alcoholLog || []).filter(e => e.date === td);
                  const units = todayAl.reduce((s, e) => s + (e.units === '>1' ? 2 : 1), 0);
                  return <MetricCard label="Alcohol" value={units > 0 ? units + '+' : null} unit="units"
                    sub={todayAl.length > 0 ? `${todayAl.length} drink${todayAl.length > 1 ? 's' : ''}` : 'today'}
                    color={units > 2 ? C.crit : units > 0 ? C.warn : C.muted} animate />;
                })()}
              </>);
            })()}
            <div style={{
              background: C.surface, border: `2px solid ${recov.color}`,
              padding: '10px 18px', display: 'flex', flexDirection: 'column',
              alignItems: 'center', justifyContent: 'center', gap: 4, minWidth: 130
            }}>
              <div style={{ fontSize: 26 }}>{recov.emoji}</div>
              <div style={{ fontSize: 10, color: recov.color, fontFamily: MONO, letterSpacing: 2, textAlign: 'center' }}>{recov.label}</div>
              <div style={{ fontSize: 9, color: C.textDim, fontFamily: SANS }}>7-day composite</div>
            </div>
          </div>

          {/* HRV chart */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 16 }}>
            <div style={{ fontSize: 10, color: C.textDim, fontFamily: SANS, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>
              HRV 30-Day + Stress &amp; Sleep Overlay
            </div>
            <ResponsiveContainer width="100%" height={420}>
              <ComposedChart data={chartData} margin={{ left: 0, right: 30, top: 5, bottom: 20 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false} />
                <XAxis dataKey="label" interval={4} height={40}
                  tick={(props) => {
                    const { x, y, payload } = props;
                    const entry = chartData.find(d => d.label === payload.value);
                    return (
                      <g transform={`translate(${x},${y})`}>
                        <text x={0} y={0} dy={12} textAnchor="middle" fill={C.textDim} fontSize={9} fontFamily={MONO}>{payload.value}</text>
                        {entry?.hasAlcohol && <text x={0} y={0} dy={26} textAnchor="middle" fontSize={11}>🍷</text>}
                      </g>
                    );
                  }}
                />
                <YAxis yAxisId="h" domain={[20, 100]} tick={{ fontSize: 9, fill: C.textDim, fontFamily: MONO }} width={30} />
                <YAxis yAxisId="s" orientation="right" domain={[0, 12]} tick={{ fontSize: 9, fill: C.muted, fontFamily: MONO }} width={20} />
                <Tooltip content={<Tip />} />
                <ReferenceLine yAxisId="h" y={HRV_BASELINE} stroke={C.warn} strokeDasharray="5 3" strokeWidth={1} />
                <Line yAxisId="h" dataKey="hrv" name="HRV" stroke={C.hrv} strokeWidth={2.5} dot={false} connectNulls={false} />
                <Line yAxisId="h" dataKey="hrv7" name="7d avg" stroke={C.hrv + '66'} strokeWidth={1.5} dot={false} strokeDasharray="4 3" connectNulls />
                <Line yAxisId="s" dataKey="stress" name="Stress" stroke={C.muted} strokeWidth={1.5} dot={false} connectNulls={false} opacity={0.7} />
                <Line yAxisId="s" dataKey="sleep" name="Sleep h" stroke='#8b5cf6' strokeWidth={2.5} dot={false} connectNulls={false} opacity={0.85} />
              </ComposedChart>
            </ResponsiveContainer>
            <div style={{ display: 'flex', gap: 16, marginTop: 6, flexWrap: 'wrap' }}>
              {[['HRV', C.hrv], ['7d avg', C.hrv + '66'], ['Stress', C.muted], ['Sleep h', '#8b5cf6'], [`Baseline ${HRV_BASELINE}ms`, C.warn]].map(([l, c]) => (
                <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 16, height: 2, background: c }} />
                  <span style={{ fontSize: 10, color: C.textDim, fontFamily: SANS }}>{l}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Pain chart */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 16 }}>
            <div style={{ fontSize: 10, color: C.textDim, fontFamily: SANS, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>
              Pain Trend 14 Days — <span style={{ color: C.right }}>R Right</span> / <span style={{ color: C.left }}>L Left</span>
            </div>
            <ResponsiveContainer width="100%" height={300}>
              <ComposedChart data={painData} margin={{ left: 0, right: 10, top: 5, bottom: 0 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false} />
                <XAxis dataKey="label" tick={{ fontSize: 9, fill: C.textDim, fontFamily: MONO }} interval={1} />
                <YAxis domain={[0, 10]} tick={{ fontSize: 9, fill: C.textDim, fontFamily: MONO }} width={25} />
                <Tooltip content={<Tip />} />
                <ReferenceLine y={2} stroke={C.warn} strokeDasharray="4 2" strokeWidth={1} />
                <Line dataKey="painR" name="Pain (R)" stroke={C.right} strokeWidth={2} dot={{ r: 3, fill: C.right }} connectNulls={false} />
                <Line dataKey="painL" name="Pain (L)" stroke={C.left} strokeWidth={2} dot={{ r: 3, fill: C.left }} connectNulls={false} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          {/* Weekly load */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 16 }}>
            <div style={{ fontSize: 10, color: C.textDim, fontFamily: SANS, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>
              Weekly Load (Last 7 Days)
            </div>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={weekLoad} margin={{ left: 0, right: 10, top: 5, bottom: 0 }} barSize={28}>
                <CartesianGrid strokeDasharray="3 3" stroke={C.border} vertical={false} />
                <XAxis dataKey="label" tick={{ fontSize: 11, fill: C.textDim, fontFamily: SANS }} />
                <YAxis allowDecimals={false} domain={[0, 4]} tick={{ fontSize: 9, fill: C.textDim, fontFamily: MONO }} width={25} />
                <Tooltip content={<Tip />} />
                <Bar dataKey="Run" name="Run" stackId="a" fill={C.hrv} radius={0} />
                <Bar dataKey="Workout" name="Workout" stackId="a" fill={C.left} radius={0} />
                <Bar dataKey="Physio" name="Physio" stackId="a" fill={C.warn} radius={[4,4,0,0]} />
              </BarChart>
            </ResponsiveContainer>
            <div style={{ display: 'flex', gap: 16, marginTop: 6, flexWrap: 'wrap' }}>
              {[['Run', C.hrv], ['Workout', C.left], ['Physio', C.warn]].map(([l, c]) => (
                <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 12, height: 12, background: c, borderRadius: 2 }} />
                  <span style={{ fontSize: 10, color: C.textDim, fontFamily: SANS }}>{l}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Insights */}
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 16 }}>
            <div style={{ fontSize: 10, color: C.textDim, fontFamily: SANS, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>
              Auto-Insights
            </div>
            {ins.map((txt, i) => (
              <div key={i} style={{
                padding: '8px 12px', borderLeft: `3px solid ${C.hrv}`,
                background: C.surface2, marginBottom: 8,
                fontSize: 12, color: C.text, fontFamily: MONO, lineHeight: 1.6
              }}>{txt}</div>
            ))}
          </div>
        </div>
      );
    }

    // ─── CHECK-IN ──────────────────────────────────────────────────────────

    function CheckIn({ checkins, setCheckins, hrvSheet, syncUrl, sleepSheet, alcoholLog, setAlcoholLog, editTarget, clearEditTarget }) {
      const td = today();
      const nowTime = () => new Date().toTimeString().slice(0, 5);

      const [selectedDate, setSelectedDate] = useState(td);
      const [editingId, setEditingId] = useState(null);

      const dateCheckins = useMemo(() =>
        checkins.filter(c => c.date === selectedDate).sort((a, b) => (a.time || '').localeCompare(b.time || '')),
        [checkins, selectedDate]
      );

      const sheetHRV = hrvSheet.find(h => h.date === selectedDate)?.hrv ?? null;
      const emptyForm = () => ({ time: nowTime(), hrv: sheetHRV, hrvManual: false, workStress: null, feeling: null, coffee: 0, water: 0, painR: 0, painL: 0, activityTypes: [], notes: '' });

      const [form, setForm] = useState(emptyForm);

      useEffect(() => { setForm(emptyForm()); setEditingId(null); }, [selectedDate]); // eslint-disable-line

      // Trigger edit from History tab
      useEffect(() => {
        if (!editTarget) return;
        setSelectedDate(editTarget.date);
        setEditingId(editTarget.id);
        setForm({ ...normaliseCI(editTarget, 0) });
        clearEditTarget();
      }, [editTarget]); // eslint-disable-line

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const toggleActivity = (type) => {
        const cur = form.activityTypes || [];
        set('activityTypes', cur.includes(type) ? cur.filter(t => t !== type) : [...cur, type]);
      };
      const startEdit = (ci) => { setEditingId(ci.id); setForm({ ...normaliseCI(ci, 0) }); };
      const startNew  = () => { setEditingId(null); setForm(emptyForm()); };
      const deleteEntry = (id) => {
        const updated = checkins.filter(c => c.id !== id);
        setCheckins(updated); store.set('checkins', updated);
        if (editingId === id) startNew();
      };
      const save = () => {
        const id = editingId || `ci_${Date.now()}`;
        const entry = { ...form, id, date: selectedDate, _savedAt: Date.now(),
          activityTypes: form.activityTypes || [] };
        const updated = [...checkins.filter(c => c.id !== id), entry]
          .sort((a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : (a.time || '').localeCompare(b.time || ''));
        setCheckins(updated); store.set('checkins', updated);
        const sleepEntry = (sleepSheet || []).find(s => s.date === selectedDate);
        appendCheckinToSheet(syncUrl, entry, sleepEntry);
        if (!editingId) startNew();
      };

      // Alcohol log helpers
      const dayAlcohol = useMemo(() =>
        (alcoholLog || []).filter(e => e.date === selectedDate).sort((a, b) => (a.time || '').localeCompare(b.time || '')),
        [alcoholLog, selectedDate]
      );
      const logAlcohol = (units) => {
        const entry = { id: `al_${Date.now()}`, date: selectedDate, time: nowTime(), units, _savedAt: Date.now() };
        const updated = [...(alcoholLog || []), entry];
        setAlcoholLog(updated); store.set('alcoholLog', updated);
      };
      const deleteAlcohol = (id) => {
        const updated = (alcoholLog || []).filter(e => e.id !== id);
        setAlcoholLog(updated); store.set('alcoholLog', updated);
      };

      const flags = autoFlags(form);
      const painColor = (v) => v > 5 ? C.crit : v > 2 ? C.warn : C.hrv;
      const LabelRow = ({ children }) => (
        <div style={{ fontSize: 12, color: C.textDim, fontFamily: SANS, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 }}>{children}</div>
      );

      const cardStyle = { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: '16px', boxShadow: '0 1px 4px rgba(37,99,235,0.06)' };
      const tapBtn = (color, active) => ({
        minHeight: 48, cursor: 'pointer', borderRadius: 10, border: `1px solid ${active ? color : C.border}`,
        background: active ? color + '18' : C.surface2, color: active ? color : C.textDim,
        fontFamily: SANS, fontWeight: active ? 700 : 400, fontSize: 14, padding: '10px 16px',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
      });

      return (
        <div style={{ padding: '16px 12px', display: 'flex', flexDirection: 'column', gap: 12, maxWidth: 600, width: '100%' }}>
          <FlagBanner flags={flags} />

          {/* Date */}
          <div style={cardStyle}>
            <LabelRow>Date</LabelRow>
            <input type="date" value={selectedDate} max={td} min={addDays(td, -60)}
              onChange={e => e.target.value && setSelectedDate(e.target.value)}
              style={{ background: C.surface2, border: `1px solid ${C.border2}`, color: C.text,
                fontFamily: SANS, fontSize: 16, fontWeight: 500, padding: '10px 12px', borderRadius: 8,
                cursor: 'pointer', width: '100%', boxSizing: 'border-box' }}
            />
            {selectedDate !== td && <div style={{ fontSize: 12, color: C.warn, fontFamily: SANS, marginTop: 6 }}>Past date: {selectedDate}</div>}
          </div>

          {/* Alcohol quick-log */}
          <div style={cardStyle}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <LabelRow>🍷 Alcohol</LabelRow>
              {dayAlcohol.length > 0 && (
                <span style={{ fontSize: 12, fontFamily: MONO, color: C.warn, fontWeight: 600 }}>
                  {dayAlcohol.reduce((s, e) => s + (e.units === '>1' ? 2 : 1), 0)}+ units today
                </span>
              )}
            </div>
            <div style={{ display: 'flex', gap: 10, marginBottom: dayAlcohol.length > 0 ? 12 : 0 }}>
              <button onClick={() => logAlcohol(1)} style={{ ...tapBtn(C.warn, false), flex: 1 }}>
                🍺 1 unit
              </button>
              <button onClick={() => logAlcohol('>1')} style={{ ...tapBtn(C.crit, false), flex: 1 }}>
                🍸 &gt;1 unit
              </button>
            </div>
            {dayAlcohol.length > 0 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                {dayAlcohol.map(e => (
                  <div key={e.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px', background: C.surface2, borderRadius: 8, border: `1px solid ${C.border}` }}>
                    <span style={{ fontFamily: MONO, fontSize: 13, color: C.left, fontWeight: 600, minWidth: 42 }}>{e.time}</span>
                    <span style={{ fontFamily: SANS, fontSize: 13, color: e.units === '>1' ? C.crit : C.warn, flex: 1 }}>
                      {e.units === '>1' ? '🍸 >1 unit' : '🍺 1 unit'}
                    </span>
                    <button onClick={() => deleteAlcohol(e.id)} style={{ background: 'none', border: 'none', color: C.muted, cursor: 'pointer', fontSize: 16, padding: '4px 6px', minHeight: 36, lineHeight: 1 }}>✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Existing check-ins for this date */}
          {dateCheckins.length > 0 && (
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, overflow: 'hidden', boxShadow: '0 1px 4px rgba(37,99,235,0.06)' }}>
              <div style={{ padding: '12px 16px', borderBottom: `1px solid ${C.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: C.surface2 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: C.text, fontFamily: SANS }}>{dateCheckins.length} check-in{dateCheckins.length > 1 ? 's' : ''}</span>
                <button onClick={startNew} style={{ background: C.left, color: '#fff', border: 'none', padding: '8px 16px', fontSize: 13, fontFamily: SANS, fontWeight: 600, cursor: 'pointer', borderRadius: 8, minHeight: 36 }}>+ New</button>
              </div>
              {dateCheckins.map(ci => {
                const acts = ci.activityTypes || (ci.activityType ? [ci.activityType] : []);
                const isEditing = editingId === ci.id;
                return (
                  <div key={ci.id} onClick={() => startEdit(ci)} style={{ padding: '12px 16px', borderBottom: `1px solid ${C.border}`, display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', background: isEditing ? C.surface2 : 'transparent', minHeight: 52 }}>
                    <span style={{ fontFamily: MONO, fontSize: 14, color: C.left, minWidth: 44, fontWeight: 600 }}>{ci.time || '—'}</span>
                    <span style={{ fontFamily: MONO, fontSize: 12, color: ci.hrv >= HRV_BASELINE ? C.hrv : ci.hrv ? C.warn : C.muted, minWidth: 50 }}>{ci.hrv ? ci.hrv + 'ms' : '—'}</span>
                    <span style={{ fontSize: 12, fontFamily: MONO, color: (ci.painR ?? 0) > 2 ? C.warn : C.right }}>R:{ci.painR ?? '—'}</span>
                    <span style={{ fontSize: 12, fontFamily: MONO, color: (ci.painL ?? 0) > 2 ? C.warn : C.left }}>L:{ci.painL ?? '—'}</span>
                    {ci.feeling != null && <span style={{ fontSize: 12, fontFamily: MONO, color: ci.feeling >= 7 ? C.hrv : ci.feeling >= 5 ? C.warn : C.crit }}>🙂{ci.feeling}</span>}
                    {ci.coffee > 0 && <span style={{ fontSize: 12, fontFamily: MONO, color: C.textDim }}>☕{ci.coffee}</span>}
                    <span style={{ fontSize: 12, color: C.textDim, fontFamily: SANS, flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{acts.join(', ') || '—'}</span>
                    {isEditing && <span style={{ fontSize: 11, color: C.left, fontFamily: MONO, fontWeight: 600 }}>✏</span>}
                  </div>
                );
              })}
            </div>
          )}

          {/* Form */}
          <div style={{ background: C.surface, border: `2px solid ${editingId ? C.warn : C.left}`, borderRadius: 12, padding: '16px', boxShadow: '0 1px 4px rgba(37,99,235,0.06)' }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: editingId ? C.warn : C.left, fontFamily: SANS, marginBottom: 16, textTransform: 'uppercase', letterSpacing: 0.5 }}>
              {editingId ? '✏ Editing entry' : '+ New Check-in'}
            </div>

            {/* Time */}
            <div style={{ marginBottom: 16 }}>
              <LabelRow>Time</LabelRow>
              <input type="time" value={form.time || ''} onChange={e => set('time', e.target.value)}
                style={{ background: C.surface2, border: `1px solid ${C.border2}`, color: C.text, fontFamily: MONO,
                  fontSize: 18, padding: '10px 12px', borderRadius: 8, width: '100%', boxSizing: 'border-box' }}
              />
            </div>

            {/* HRV */}
            <div style={{ marginBottom: 16 }}>
              <LabelRow>HRV (ms) {sheetHRV && !form.hrvManual ? '— auto from Sheets' : form.hrvManual ? '— manual' : ''}</LabelRow>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                <input type="number" min={0} max={200} value={form.hrv ?? ''}
                  onChange={e => { set('hrv', e.target.value ? Number(e.target.value) : null); set('hrvManual', true); }}
                  style={{ background: C.surface2, border: `1px solid ${C.border2}`, color: C.text, fontFamily: MONO, fontSize: 24, padding: '8px 12px', width: 90, borderRadius: 8 }}
                />
                <span style={{ fontFamily: MONO, fontSize: 14, color: C.textDim }}>ms</span>
                {form.hrv != null && (
                  <span style={{ fontSize: 12, fontFamily: MONO, color: form.hrv >= HRV_BASELINE ? C.hrv : form.hrv >= HRV_BASELINE * 0.8 ? C.warn : C.crit }}>
                    {form.hrv >= HRV_BASELINE ? '+' : ''}{form.hrv - HRV_BASELINE} vs baseline
                  </span>
                )}
                {sheetHRV && form.hrvManual && (
                  <Btn small onClick={() => { set('hrv', sheetHRV); set('hrvManual', false); }}>Reset ({sheetHRV})</Btn>
                )}
              </div>
            </div>

            {/* Work stress */}
            <div style={{ marginBottom: 16 }}>
              <LabelRow>Work Stress (1–5)</LabelRow>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {[[1,'😌','Calm'],[2,'🙂','Easy'],[3,'😐','Moderate'],[4,'😓','Stressed'],[5,'😤','Overloaded']].map(([v,icon,label]) => (
                  <button key={v} onClick={() => set('workStress', form.workStress === v ? null : v)} style={{
                    background: form.workStress === v ? C.surface3 : 'transparent',
                    border: `1px solid ${form.workStress === v ? C.warn : C.border}`,
                    color: C.text, padding: '10px 12px', cursor: 'pointer', borderRadius: 10, minHeight: 60,
                    display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3,
                    opacity: form.workStress && form.workStress !== v ? 0.4 : 1, flex: 1,
                  }}>
                    <span style={{ fontSize: 24 }}>{icon}</span>
                    <span style={{ fontSize: 10, fontFamily: SANS, color: C.textDim }}>{label}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* General Feeling */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <LabelRow>General Feeling (1–10)</LabelRow>
                {form.feeling != null && (
                  <span style={{ fontSize: 12, fontFamily: MONO, color: form.feeling >= 7 ? C.hrv : form.feeling >= 5 ? C.warn : C.crit }}>
                    {form.feeling >= 8 ? '🌟 Great' : form.feeling >= 6 ? '🙂 Good' : form.feeling >= 4 ? '😐 OK' : form.feeling >= 2 ? '😕 Low' : '😖 Rough'}
                  </span>
                )}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                <input type="range" min={1} max={10} value={form.feeling ?? 5}
                  onChange={e => set('feeling', Number(e.target.value))}
                  onMouseDown={() => { if (form.feeling == null) set('feeling', 5); }}
                  onTouchStart={() => { if (form.feeling == null) set('feeling', 5); }}
                  style={{ flex: 1, height: 28, accentColor: form.feeling >= 7 ? C.hrv : form.feeling >= 5 ? C.warn : C.crit }} />
                <div style={{ width: 44, height: 44, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  background: (form.feeling >= 7 ? C.hrv : form.feeling >= 5 ? C.warn : form.feeling != null ? C.crit : C.muted) + '22',
                  border: `2px solid ${form.feeling >= 7 ? C.hrv : form.feeling >= 5 ? C.warn : form.feeling != null ? C.crit : C.border}`,
                  fontFamily: MONO, fontSize: 20, color: form.feeling >= 7 ? C.hrv : form.feeling >= 5 ? C.warn : form.feeling != null ? C.crit : C.textDim,
                  borderRadius: 8 }}>{form.feeling ?? '—'}</div>
                {form.feeling != null && <button onClick={() => set('feeling', null)} style={{ background: 'none', border: 'none', color: C.textDim, cursor: 'pointer', fontSize: 18, minHeight: 44, minWidth: 36 }}>✕</button>}
              </div>
            </div>

            {/* Coffee */}
            <div style={{ marginBottom: 16 }}>
              <LabelRow>Coffee</LabelRow>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <button onClick={() => set('coffee', Math.max(0, (form.coffee || 0) - 1))}
                  style={{ minWidth: 44, minHeight: 44, background: C.surface2, border: `1px solid ${C.border}`, color: C.textDim, cursor: 'pointer', borderRadius: 8, fontSize: 18 }}>−</button>
                <div style={{ flex: 1, textAlign: 'center', background: C.surface2, border: `1px solid ${(form.coffee || 0) > 0 ? C.warn : C.border}`,
                  borderRadius: 8, padding: '10px 0', fontSize: 16, fontFamily: MONO, fontWeight: 600, color: (form.coffee || 0) > 0 ? C.warn : C.textDim }}>
                  ☕ {form.coffee || 0}
                </div>
                <button onClick={() => set('coffee', (form.coffee || 0) + 1)}
                  style={{ minWidth: 44, minHeight: 44, background: C.surface2, border: `1px solid ${C.border}`, color: C.textDim, cursor: 'pointer', borderRadius: 8, fontSize: 18 }}>+</button>
              </div>
            </div>

            {/* Pain L */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <LabelRow>Pain — LEFT Knee (0–10)</LabelRow>
                <span style={{ fontSize: 11, color: C.left, fontFamily: MONO, fontWeight: 600 }}>SECONDARY</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                <input type="range" min={0} max={10} value={form.painL} onChange={e => set('painL', Number(e.target.value))} style={{ flex: 1, height: 28, accentColor: C.left }} />
                <div style={{ width: 44, height: 44, display: 'flex', alignItems: 'center', justifyContent: 'center', background: painColor(form.painL)+'22', border: `2px solid ${painColor(form.painL)}`, fontFamily: MONO, fontSize: 20, color: painColor(form.painL), borderRadius: 8 }}>{form.painL}</div>
              </div>
              {form.painL > 2 && <div style={{ fontSize: 12, color: C.warn, fontFamily: MONO, marginTop: 4 }}>▲ Exceeds 2/10 threshold</div>}
            </div>

            {/* Pain R */}
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <LabelRow>Pain — RIGHT Knee (0–10)</LabelRow>
                <span style={{ fontSize: 11, color: C.right, fontFamily: MONO, fontWeight: 600 }}>PRIMARY</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>

    // ─── RUN PROTOCOL ──────────────────────────────────────────────────────

    function RunProtocol({ runProtocol, setRunProtocol, checkins }) {
      const td = today();
      const currentWeek = runProtocol.currentWeek || 1;
      const sessions = runProtocol.sessions || [];
      const weekSessions = sessions.filter(s => s.week === currentWeek);
      const completedSessions = weekSessions.filter(s => s.completed);
      const weekDef = RUN_WEEKS[Math.min(currentWeek - 1, RUN_WEEKS.length - 1)];
      const canAdvance = completedSessions.length >= 3 && currentWeek < 4;

      const logSession = () => {
        const ci = checkins.find(c => c.date === td);
        const painR = ci?.painR ?? 0;
        const painL = ci?.painL ?? 0;
        const regressed = painR > 2 || painL > 2;
        const sessionNum = weekSessions.length + 1;
        const newSession = { date: td, week: currentWeek, sessionNum, painR, painL, completed: !regressed, regressed };
        const updated = { ...runProtocol, sessions: [...sessions, newSession] };
        setRunProtocol(updated);
        store.set('runProtocol', updated);
      };

      const advanceWeek = () => {
        const updated = { ...runProtocol, currentWeek: currentWeek + 1 };
        setRunProtocol(updated);
        store.set('runProtocol', updated);
      };

      return (
        <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 16 }}>
          <div style={{ fontSize: 11, color: C.textDim, fontFamily: SANS }}>
            Advance only when 3 sessions completed, pain ≤2/10 both legs. RIGHT pain >2 = regression, session not counted.
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            {RUN_WEEKS.map(w => {
              const wS = sessions.filter(s => s.week === w.week);
              const wC = wS.filter(s => s.completed).length;
              const isCur = w.week === currentWeek;
              const isPast = w.week < currentWeek;
              return (
                <div key={w.week} style={{
                  background: isCur ? C.surface2 : C.surface,
                  border: `1px solid ${isCur ? C.hrv : C.border}`,
                  padding: '14px 18px', minWidth: 155,
                  opacity: w.week > currentWeek ? 0.45 : 1
                }}>
                  <div style={{ fontSize: 10, color: isCur ? C.hrv : C.textDim, fontFamily: MONO, letterSpacing: 1, marginBottom: 6 }}>
                    WEEK {w.week} {isCur ? '◀ CURRENT' : isPast ? '✓ DONE' : ''}
                  </div>
                  {w.run ? (
                    <>
                      <div style={{ fontSize: 13, color: C.text, fontFamily: SANS, marginBottom: 2 }}>
                        {w.run}min run / {w.walk}min walk
                      </div>
                      <div style={{ fontSize: 11, color: C.textDim, fontFamily: MONO }}>× {w.reps} · {w.freq}×/week</div>
                    </>
                  ) : (
                    <div style={{ fontSize: 12, color: C.text, fontFamily: SANS }}>{w.desc}</div>
                  )}
                  <div style={{ display: 'flex', gap: 5, marginTop: 10 }}>
                    {[1, 2, 3].map(n => {
                      const s = wS.find(x => x.sessionNum === n);
                      const col = s ? (s.completed ? C.hrv : C.crit) : C.border2;
                      return (
                        <div key={n} style={{
                          width: 26, height: 26,
                          background: s ? col + '33' : 'transparent',
                          border: `1px solid ${col}`,
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 10, color: col, fontFamily: MONO
                        }}>
                          {s ? (s.regressed ? '✗' : '✓') : n}
                        </div>
                      );
                    })}
                  </div>
                  {isCur && <div style={{ fontSize: 10, color: C.textDim, fontFamily: SANS, marginTop: 5 }}>{wC}/3 completed</div>}
                </div>
              );
            })}
          </div>

          <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 16 }}>
            <div style={{ fontSize: 12, color: C.hrv, fontFamily: MONO, letterSpacing: 1, marginBottom: 10 }}>WEEK {currentWeek} — ACTIVE</div>
            {weekDef?.run ? (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 18, color: C.text, fontFamily: SANS, marginBottom: 4 }}>
                  {weekDef.run}min run / {weekDef.walk}min walk × {weekDef.reps}
                </div>
                <div style={{ fontSize: 12, color: C.textDim, fontFamily: MONO }}>
                  ~{(weekDef.run + weekDef.walk) * weekDef.reps}min total · {weekDef.freq}×/week
                </div>
              </div>
            ) : weekDef && (
              <div style={{ fontSize: 15, color: C.text, fontFamily: SANS, marginBottom: 14 }}>{weekDef.desc}</div>
            )}
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <button onClick={logSession} style={{
                background: C.left+'15', border: `1px solid ${C.left}`,
                color: C.left, padding: '10px 20px', fontSize: 12,
                fontFamily: MONO, cursor: 'pointer', borderRadius: 2
              }}>+ LOG TODAY'S SESSION</button>
              {canAdvance && (
                <button onClick={advanceWeek} style={{
                  background: C.hrv + '22', border: `1px solid ${C.hrv}`,
                  color: C.hrv, padding: '10px 20px', fontSize: 12,
                  fontFamily: MONO, cursor: 'pointer', borderRadius: 2
                }}>ADVANCE TO WEEK {currentWeek + 1} →</button>
              )}
            </div>
          </div>

          {sessions.length > 0 && (
            <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 16 }}>
              <div style={{ fontSize: 10, color: C.textDim, fontFamily: SANS, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>Session Log</div>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12, fontFamily: MONO }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                    {['Date', 'Wk', '#', 'R', 'L', 'Status'].map(h => (
                      <th key={h} style={{ padding: '6px 10px', color: C.textDim, fontFamily: SANS, fontSize: 10, textAlign: 'left', textTransform: 'uppercase', letterSpacing: 1 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...sessions].reverse().map((s, i) => (
                    <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                      <td style={{ padding: '6px 10px', color: C.textDim }}>{s.date}</td>
                      <td style={{ padding: '6px 10px', color: C.text }}>W{s.week}</td>
                      <td style={{ padding: '6px 10px', color: C.text }}>{s.sessionNum}</td>
                      <td style={{ padding: '6px 10px', color: s.painR > 2 ? C.warn : C.right }}>{s.painR}</td>
                      <td style={{ padding: '6px 10px', color: s.painL > 2 ? C.warn : C.left }}>{s.painL}</td>
                      <td style={{ padding: '6px 10px', color: s.completed ? C.hrv : C.crit }}>{s.completed ? '✓ OK' : '✗ Regressed'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ─── HISTORY ───────────────────────────────────────────────────────────

    function History({ checkins, sleepSheet = [], alcoholLog = [], onEdit }) {
      const [sortDir, setSortDir] = useState('desc');
      const sorted = useMemo(() =>
        [...checkins].sort((a, b) => {
          const dc = sortDir === 'desc' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date);
          if (dc !== 0) return dc;
          const tc = (a.time || '').localeCompare(b.time || '');
          return sortDir === 'desc' ? -tc : tc;
        }),
        [checkins, sortDir]
      );
      const alcoholByDate = useMemo(() => {
        const m = {};
        for (const e of alcoholLog) {
          if (!m[e.date]) m[e.date] = { units: 0, count: 0 };
          m[e.date].units += e.units === '>1' ? 2 : 1;
          m[e.date].count += 1;
        }
        return m;
      }, [alcoholLog]);
      const exportCSV = () => {
        const hdr = ['Date', 'Time', 'HRV', 'Feeling', 'Stress', 'Coffee', 'Sleep_h', 'Sleep_Score', 'Pain_L', 'Pain_R', 'Alcohol_units', 'Activities', 'Notes'];
        const rows = sorted.map(c => {
          const se = sleepSheet.find(s => s.date === c.date);
          const al = alcoholByDate[c.date];
          return [
            c.date, c.time ?? '', c.hrv ?? '', c.feeling ?? '', c.workStress ?? '',
            c.coffee ?? '',
            se?.sleepHours ?? '', se?.sleepScore ?? '',
            c.painL ?? '', c.painR ?? '',
            al ? al.units + '+' : '',
            (c.activityTypes || (c.activityType ? [c.activityType] : [])).join(';'),
            (c.notes ?? '').replace(/,/g, ';'),
          ];
        });
        const csv = [hdr, ...rows].map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'itbs-history.csv'; a.click();
        URL.revokeObjectURL(url);
      };
      return (
        <div style={{ padding: 20 }}>
          <div style={{ display: 'flex', gap: 10, marginBottom: 16, alignItems: 'center' }}>
            <span style={{ fontSize: 11, color: C.textDim, fontFamily: SANS }}>{sorted.length} entries</span>
            <Btn small onClick={() => setSortDir(d => d === 'desc' ? 'asc' : 'desc')}>
              {sortDir === 'desc' ? '↓ Newest first' : '↑ Oldest first'}
            </Btn>
            <Btn small onClick={exportCSV}>Export CSV</Btn>
          </div>
          {sorted.length === 0 ? (
            <div style={{ color: C.textDim, fontFamily: SANS, fontSize: 13, padding: 20 }}>
              No check-ins yet. Start in the Check-in tab.
            </div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12, fontFamily: MONO }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                    {['', 'Date', 'Time', 'HRV ms', 'Feeling', 'Stress', 'Coffee', 'Sleep h', 'Sleep Score', 'Pain L ←', 'Pain R →', 'Alcohol', 'Activities', 'Notes'].map(h => (
                      <th key={h} style={{ padding: '8px 10px', color: C.textDim, fontFamily: SANS, fontSize: 10, textAlign: 'left', textTransform: 'uppercase', letterSpacing: 1, whiteSpace: 'nowrap' }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((c, i) => {
                    const activities = c.activityTypes || (c.activityType ? [c.activityType] : []);
                    const se = sleepSheet.find(s => s.date === c.date);
                    const sh = se?.sleepHours ?? null;
                    const sc = se?.sleepScore ?? null;
                    const al = alcoholByDate[c.date];
                    return (
                      <tr key={c.id || c.date + (c.time || '')} style={{ borderBottom: `1px solid ${C.border}`, background: i % 2 === 0 ? 'transparent' : C.surface3 + '44' }}>
                        <td style={{ padding: '4px 6px' }}>
                          <button onClick={() => onEdit && onEdit(c)} style={{ background: 'none', border: `1px solid ${C.border}`, borderRadius: 5, cursor: 'pointer', color: C.left, fontSize: 12, padding: '3px 7px', fontFamily: MONO, whiteSpace: 'nowrap' }}>✏ Edit</button>
                        </td>
                        <td style={{ padding: '8px 10px', color: C.textDim }}>{c.date}</td>
                        <td style={{ padding: '8px 10px', color: C.textDim }}>{c.time || '—'}</td>
                        <td style={{ padding: '8px 10px', color: c.hrv >= HRV_BASELINE ? C.hrv : c.hrv >= HRV_BASELINE * 0.8 ? C.warn : c.hrv ? C.crit : C.textDim }}>{c.hrv ?? '—'}</td>
                        <td style={{ padding: '8px 10px', color: c.feeling >= 7 ? C.hrv : c.feeling >= 5 ? C.warn : c.feeling != null ? C.crit : C.textDim }}>{c.feeling ?? '—'}</td>
                        <td style={{ padding: '8px 10px', color: c.workStress >= 4 ? C.crit : c.workStress >= 3 ? C.warn : C.text }}>{c.workStress ?? '—'}</td>
                        <td style={{ padding: '8px 10px', color: (c.coffee||0) > 3 ? C.warn : C.textDim }}>{c.coffee > 0 ? '☕×'+c.coffee : '—'}</td>
                        <td style={{ padding: '8px 10px', color: sh >= 7 ? C.hrv : sh >= 6 ? C.warn : sh != null ? C.crit : C.textDim }}>{sh != null ? sh + 'h' : '—'}</td>
                        <td style={{ padding: '8px 10px', color: C.textDim }}>{sc != null ? sc : '—'}</td>
                        <td style={{ padding: '8px 10px', color: c.painL > 5 ? C.crit : c.painL > 2 ? C.warn : c.painL != null ? C.left : C.textDim }}>{c.painL != null ? c.painL : '—'}</td>
                        <td style={{ padding: '8px 10px', color: c.painR > 5 ? C.crit : c.painR > 2 ? C.warn : c.painR != null ? C.right : C.textDim }}>{c.painR != null ? c.painR : '—'}</td>
                        <td style={{ padding: '8px 10px', color: al ? (al.units > 2 ? C.crit : C.warn) : C.textDim }}>
                          {al ? `🍷 ${al.units}+ u` : '—'}
                        </td>
                        <td style={{ padding: '8px 10px', color: C.text }}>
                          {activities.length > 0 ? (
                            <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                              {activities.map(a => (
                                <span key={a} style={{ background: C.surface3, border: `1px solid ${C.border}`, borderRadius: 4, padding: '1px 6px', fontSize: 10, fontFamily: SANS, color: C.text }}>{a}</span>
                              ))}
                            </div>
                          ) : '—'}
                        </td>
                        <td style={{ padding: '8px 10px', color: C.textDim, maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.notes || '—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ─── SYNC SETUP ────────────────────────────────────────────────────────

    const APPS_SCRIPT_CODE = `function doGet(e) {
  if (e && e.parameter && e.parameter._action === 'getGarmin') {
    return getHealthData();
  }
  var sh = getOrCreate('AppSync');
  var v = sh.getRange('A1').getValue();
  return ContentService.createTextOutput(v || '{}').setMimeType(ContentService.MimeType.JSON);
}
function getHealthData() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var wsh = ss.getSheetByName('Wellness & Garmin');
  var hrvData = [], sleepData = [];
  if (wsh) {
    var rows = wsh.getDataRange().getValues();
    if (rows.length >= 2) {
      var h = rows[0].map(function(v){ return String(v).toLowerCase().trim(); });
      var idIdx=h.indexOf('id'), hrvIdx=h.indexOf('hrv'), secsIdx=h.indexOf('sleepsecs'), scoreIdx=h.indexOf('sleepscore');
      for (var i=1; i<rows.length; i++) {
        var row=rows[i], date=String(row[idIdx]||'').trim();
        if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) continue;
        var hrv=parseFloat(row[hrvIdx]), secs=parseFloat(row[secsIdx]), score=parseFloat(row[scoreIdx]);
        if (hrv>0&&!isNaN(hrv)) hrvData.push({date:date,hrv:Math.round(hrv)});
        if (secs>0&&!isNaN(secs)){var e={date:date,sleepHours:Math.round(secs/360)/10};if(score>0&&!isNaN(score))e.sleepScore=Math.round(score);sleepData.push(e);}
      }
    }
  }
  var ash = ss.getSheetByName('Activities');
  var activitiesData = [];
  if (ash) {
    var arows = ash.getDataRange().getValues();
    if (arows.length >= 2) {
      var ah = arows[0].map(function(v){ return String(v).trim(); });
      var dtIdx=ah.indexOf('start_date_local'), tpIdx=ah.indexOf('type'), nmIdx=ah.indexOf('name'), dsIdx=ah.indexOf('distance'), mtIdx=ah.indexOf('moving_time'), ldIdx=ah.indexOf('icu_training_load');
      for (var i=1; i<arows.length; i++) {
        var row=arows[i];
        var dateStr=String(row[dtIdx]||'').trim();
        if (!dateStr) continue;
        var date=dateStr.substring(0,10);
        if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)) continue;
        activitiesData.push({date:date,type:String(row[tpIdx]||'').trim(),name:String(row[nmIdx]||'').trim(),distance:parseFloat(row[dsIdx])||0,movingTime:parseInt(row[mtIdx])||0,load:parseFloat(row[ldIdx])||0});
      }
    }
  }
  return ContentService.createTextOutput(JSON.stringify({hrvData:hrvData,sleepData:sleepData,activitiesData:activitiesData})).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  if (data._action === 'appendCheckin') {
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sh = ss.getSheetByName('Health Checkin');
    if (!sh) sh = ss.insertSheet('Health Checkin');
    if (sh.getLastRow() === 0) {
      sh.appendRow(['Date','Time','HRV','Stress','Feeling','Coffee','Pain R','Pain L','Sleep h','Sleep Score','Activities','Notes']);
    }
    sh.appendRow([data.date,data.time,data.hrv,data.workStress,data.feeling,data.coffee,data.painR,data.painL,data.sleepHours,data.sleepScore,(data.activityTypes||[]).join(', '),data.notes]);
    return ContentService.createTextOutput('{"ok":true}').setMimeType(ContentService.MimeType.JSON);
  }
  var sh = getOrCreate('AppSync');
  sh.getRange('A1').setValue(e.postData.contents);
  sh.getRange('B1').setValue(new Date().toISOString());
  return ContentService.createTextOutput('{"ok":true}').setMimeType(ContentService.MimeType.JSON);
}
function getOrCreate(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  return ss.getSheetByName(name) || ss.insertSheet(name);
}`;

    function SyncSetup({ syncUrl, onSave, onClose }) {
      const [url, setUrl] = React.useState(syncUrl || '');
      const [copied, setCopied] = React.useState(false);
      const copyScript = () => {
        navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
      };
      return (
        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,0.45)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>

            <div style={{ fontSize:13, fontFamily:C.SANS, fontWeight:700, color:C.text, marginBottom:16 }}>☁ Cloud Sync Setup</div>
            <div style={{ fontSize:11, color:C.textDim, fontFamily:'sans-serif', marginBottom:12, lineHeight:1.6 }}>
              1. Open your Health Metrics Google Sheet → <b>Extensions → Apps Script</b><br/>
              2. Select all, paste the code below, save and deploy as web app (Execute as: Me, Anyone can access)<br/>
              3. Paste the deployment URL here
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
              <span style={{ fontSize:10, color:C.textDim, fontFamily:'monospace', textTransform:'uppercase', letterSpacing:1 }}>Apps Script Code</span>
              <button onClick={copyScript} style={{ fontSize:11, padding:'4px 10px', background: copied ? C.hrv+'22' : C.surface2, border:`1px solid ${copied ? C.hrv : C.border}`, color: copied ? C.hrv : C.textDim, borderRadius:4, cursor:'pointer', fontFamily:'monospace' }}>{copied ? '✓ Copied' : 'Copy'}</button>
            </div>
            <pre style={{ background:C.surface2, border:`1px solid ${C.border}`, borderRadius:6, padding:10, fontSize:9, fontFamily:'monospace', overflowX:'auto', maxHeight:160, marginBottom:16, whiteSpace:'pre-wrap', wordBreak:'break-all' }}>{APPS_SCRIPT_CODE}</pre>
            <div style={{ fontSize:11, color:C.textDim, fontFamily:'sans-serif', marginBottom:6 }}>Deployment URL</div>
            <input value={url} onChange={e => setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." style={{ width:'100%', fontSize:12, padding:'8px 10px', border:`1px solid ${C.border}`, borderRadius:6, marginBottom:16, fontFamily:'monospace' }} />
            <div style={{ display:'flex', gap:10, justifyContent:'flex-end' }}>
              <button onClick={onClose} style={{ padding:'8px 16px', background:C.surface2, border:`1px solid ${C.border}`, borderRadius:6, cursor:'pointer', fontSize:12 }}>Cancel</button>
              <button onClick={() => onSave(url)} style={{ padding:'8px 16px', background:C.left, border:'none', borderRadius:6, cursor:'pointer', fontSize:12, color:'#fff', fontWeight:600 }}>Save</button>
            </div>
          </div>
        </div>
      );
    }
